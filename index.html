e choice only. No account names, credentials, rosters or sessions. */

(()=>{
 const origin='https://2026ndjhs.github.io',channel='moabom-pages-v1';

 function endResume(){delete document.documentElement.dataset.refreshing;if(resume)resume.hidden=true;}
 const target='https://script.google.com/macros/s/AKfycbwNx-tav4ugldAqagWKFkDG95o9bsc81qoh_vr4iOrEs1RVWPEumuZxIBYTlrE2ebY/exec?embed=moabom-pages-v1&moabom_host=github-pages-v1';
 if(window.self!==window.top){status.textContent='모아봄 공식 주소에서 열어 주세요.';return;}
 let source=null,sourceOrigin='',nonce='',ready=false,role='',timer;
 const allowedOrigin=value=>{try{const u=new URL(value);return u.protocol==='https:'&&(u.hostname==='script.google.com'||u.hostname.endsWith('.googleusercontent.com'));}catch(error){return false;}};
 function openRole(){if(!ready||!role)return;status.textContent='Google에서 로그인 입력창을 열고 있습니다.';source.postMessage({type:'moabom:entry-role',channel,nonce,role},sourceOrigin);}
 document.querySelectorAll('[data-entry-role]').forEach(button=>button.addEventListener('click',()=>{role=button.dataset.entryRole;document.querySelectorAll('[data-entry-role]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));status.textContent=ready?'로그인 입력창을 열고 있습니다.':'Google 로그인 서버에 연결하고 있습니다.';openRole();}));
 window.addEventListener('message',event=>{
  if(!allowedOrigin(event.origin)||!event.source||event.source===window)return;
  try{if(event.source.top!==window)return;}catch(error){return;}
  const d=event.data;if(!d||d.channel!==channel||typeof d.nonce!=='string'||!/^[a-f0-9-]{36}$/i.test(d.nonce))return;

 });
 frame.src=target;
 timer=setTimeout(()=>{if(!ready){status.textContent='Google 연결이 늦어지고 있습니다. 잠시 기다려 주세요.';const message=document.querySelector('#resume-status');if(message)message.textContent='연결이 지연되고 있습니다. 현재 화면을 확인하는 중입니다.';}},15000);
