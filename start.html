<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-WbZdDrL2bYXC7p7mAUNvdKWOYdxx49xWhZyAB/SqilA='; style-src 'sha256-xXEukWE0RK+bqL6JNm44z/QCLbMhFveiu3Mb3LpoHBI='; img-src 'self'; frame-src https://script.google.com https://*.googleusercontent.com https://accounts.google.com; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"><title>모아봄 | 학교 보고서 제출함</title><link rel="icon" href="school-logo.svg" type="image/svg+xml"><style>html,body{margin:0;width:100%;height:100%;background:#f3f6fb;color:#20324e;font-family:system-ui,"Malgun Gothic",sans-serif}body{overflow:hidden}iframe{display:block;border:0;position:fixed;inset:0;width:100%;height:100vh;height:100dvh;background:#f3f6fb}[hidden]{display:none!important}#loading{position:fixed;z-index:2;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);padding:8px 12px;border:1px solid #d8e1f0;border-radius:8px;background:white;font-size:13px;white-space:nowrap}button{border:1px solid #d8e1f0;border-radius:6px;padding:5px 8px;background:white;color:#315ff4;font:inherit;cursor:pointer}noscript{position:fixed;z-index:3;inset:0;background:white;padding:24px}</style><link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://www.gstatic.com" crossorigin></head>
<body><iframe id="moabom" title="모아봄 학교 보고서 제출함" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms allow-downloads allow-modals allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation" allow="fullscreen"></iframe><div id="loading" role="status"><span id="status">모아봄을 불러오고 있습니다.</span><button id="retry" type="button" hidden>다시 연결</button></div><noscript>모아봄을 이용하려면 브라우저의 JavaScript를 켜 주세요.</noscript><script>/* Public launcher only. Credentials, files and sessions stay inside Google. */
'use strict';
(()=>{
 const APP_URL='https://script.google.com/macros/s/AKfycbwNx-tav4ugldAqagWKFkDG95o9bsc81qoh_vr4iOrEs1RVWPEumuZxIBYTlrE2ebY/exec',channel='moabom-pages-v1',frame=document.querySelector('#moabom'),loading=document.querySelector('#loading'),status=document.querySelector('#status'),retry=document.querySelector('#retry');
 if(window.self!==window.top){status.textContent='모아봄 공식 접속 주소에서 열어 주세요.';frame.hidden=true;return;}
 let source=null,nonce='',timer,loaded=false;
 frame.addEventListener('load',()=>{if(!frame.getAttribute('src'))return;loaded=true;clearTimeout(timer);loading.hidden=true;});
 const googleOrigin=value=>{try{const u=new URL(value);return u.protocol==='https:'&&(u.hostname==='script.google.com'||u.hostname.endsWith('.googleusercontent.com'));}catch(error){return false;}};
 window.addEventListener('message',event=>{
  if(!googleOrigin(event.origin)||event.source===window||!event.source)return;
  try{if(event.source.top!==window)return;}catch(error){return;}
  const data=event.data;if(!data||data.channel!==channel||typeof data.nonce!=='string'||!/^[a-f0-9-]{36}$/i.test(data.nonce))return;
  if(data.type==='moabom:hello'){
   source=event.source;nonce=data.nonce;
   source.postMessage({type:'moabom:approved',channel,nonce,path:'/moabom/'},event.origin);
  }else if(data.type==='moabom:ready'&&event.source===source&&data.nonce===nonce){clearTimeout(timer);loading.hidden=true;frame.hidden=false;}
 });
 function connect(reload=false){
  clearTimeout(timer);source=null;nonce='';loaded=false;loading.hidden=false;retry.hidden=true;frame.hidden=false;status.textContent='모아봄을 불러오고 있습니다.';
  const target=new URL(APP_URL);target.searchParams.set('embed',channel);target.searchParams.set('moabom_host','github-pages-v1');if(reload||frame.getAttribute('src')!==target.href)frame.src=target.href;
  timer=setTimeout(()=>{if(loaded)return;status.textContent='연결이 지연되고 있습니다.';retry.hidden=false;},20000);
 }
 retry.addEventListener('click',()=>connect(true));connect();
})();</script></body></html>
